<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — sign in</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
  }
  form {
    width: 320px; padding: 32px; border-radius: 14px; background: #161f36;
    border: 1px solid #263252; display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 1.05rem; margin: 0 0 4px; font-weight: 650; }
  p.sub { margin: 0 0 10px; color: #8291b3; font-size: .85rem; }
  label { font-size: .8rem; color: #a7b4d1; display: block; margin-bottom: 5px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c3a5e;
    background: #0f1830; color: #e2e8f0; font: inherit;
  }
  input:focus { outline: none; border-color: #5b7fff; }
  button {
    margin-top: 6px; padding: 11px; border: 0; border-radius: 8px; cursor: pointer;
    background: #5b7fff; color: #fff; font: inherit; font-weight: 650;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #ff8080; font-size: .82rem; min-height: 1.2em; }
</style>
</head>
<body>
  <form id="f">
    <div>
      <h1>Admin dashboard</h1>
      <p class="sub">Bookings, conversations, leads, CRM and social — one place.</p>
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <div class="err" id="err"></div>
    <button type="submit" id="btn">Sign in</button>
  </form>

  <script>
    const form = document.getElementById("f");
    const err = document.getElementById("err");
    const btn = document.getElementById("btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "Signing in…";

      try {
        const res = await fetch("/admin/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          err.textContent = d.error || "Sign in failed.";
          btn.disabled = false;
          btn.textContent = "Sign in";
          return;
        }
        // The cookie is set; reload so the server serves the authed shell.
        location.href = "/admin";
      } catch {
        err.textContent = "Could not reach the server.";
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
